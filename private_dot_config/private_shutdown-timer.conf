# Read by ~/bin/shutdown-timer. Plain sh, sourced.
#
# hypridle arms this when the session locks after 10 minutes idle, and disarms it
# the moment you come back. If you never come back, the machine powers itself off
# DELAY seconds later.

# Seconds after arming before shutdown begins.
DELAY=3600

# rc.d services to stop cleanly before powering off, space separated. Empty:
# nothing here needs it yet. Anything listed needs matching doas rules -- see
# the comment at the end of ~/bin/shutdown-timer.
SERVICES=""

# Seconds to wait for each service to stop before retrying, and how many
# attempts before giving up and powering off regardless.
GRACE=120
RETRIES=3
