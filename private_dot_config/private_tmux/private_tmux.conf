# ============================================= #
# Tmux Plugin Manager (TPM) Setup               #
# ============================================= #

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @tmux-which-key-xdg-enable 1

set -g @sessionx-bind-zo-new-window 'ctrl-n'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/home/acid/Workspace'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/Workspace'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-filtered-sessions 'floax-scratch'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @floax-session-name 'floax-scratch'

set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'off'

set -g @yank-action 'copy-pipe'

set -g @thumbs-key 'f'
set -g @thumbs-command 'printf %s {} | wl-copy'
set -g @thumbs-upcase-command 'tmux set-buffer -- {} && tmux paste-buffer && tmux display-message "Pasted: {}"'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_date_time_icon " "

set -g @catppuccin_application_icon ' '
set -g @catppuccin_application_text "#{b:pane_current_command}"

set -g @catppuccin_directory_icon ' '
set -g @catppuccin_directory_text " #{b:pane_path}"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ============================================= #
# General Settings                              #
# ============================================= #

set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -s escape-time 0
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g exit-empty off

# Pane appearance
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# --- Terminal ---
set -as terminal-features ',xterm-kitty:RGB:clipboard:strikethrough:usstyle:overline:mouse:cstyle:extkeys'
set -ga terminal-overrides ',xterm-kitty:Ss=\E[%p1%d q:Se=\E[ q'
set -s extended-keys on

# --- Resize handling ---
set -g aggressive-resize off
set -g window-size latest
set -g allow-passthrough on

# --- Prefix key ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Keybindings ---

# Session & windows
bind c new-window -c "#{pane_current_path}"
bind '~' new-window -c "$HOME"
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind X confirm-before -p "Kill window? (y/n)" kill-window
bind C-x confirm-before -p "Kill server? (y/n)" kill-server
bind ^X lock-server
bind ^D detach
bind C list-clients
bind : command-prompt
bind r command-prompt "rename-window %%"
bind R command-prompt "rename-session %%"
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded!"
bind Tab last-window
bind ^ select-window -t :^
bind $ select-window -t :$
bind ^W list-windows
bind w list-windows
bind W choose-window
bind ^L refresh-client
bind H previous-window
bind L next-window

# Splitting panes (symbolic: | = vertical divider, - = horizontal line)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind z resize-pane -Z

# Pane utilities
bind s swap-pane -D
bind * setw synchronize-panes
bind P set pane-border-status
bind K send-keys "clear" Enter

# Session management
bind S choose-session

# Sesh picker (prefix + T)
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list --icons)'
)\""

# Copy mode (vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection

set -g status on
set -g status-interval 2
set -g status-position top
set -g status-left-length 60
set -g status-right-length 120

set -g status-style 'bg=default'
set -g window-status-style 'bg=default'
set -g window-status-current-style 'bg=default'

set -g status-left ""
set -g status-right '#{E:@catppuccin_status_session}#{E:@catppuccin_status_application}#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time} #(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)'

# Refresh environment on attach
set -g update-environment "WAYLAND_DISPLAY XDG_RUNTIME_DIR XDG_CURRENT_DESKTOP DISPLAY SWAYSOCK HYPRLAND_INSTANCE_SIGNATURE"

# ============================================= #
# Auto-Bootstrapping TPM                        #
# ============================================= #

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
