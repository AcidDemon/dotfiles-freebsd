# hypridle on FreeBSD + niri.
#
# Adapted from the NixOS/hyprland version. Three things there do not apply here:
#
#   hyprctl dispatch dpms   hyprland's IPC. niri's equivalent is
#                           `niri msg action power-off-monitors` / `power-on-monitors`.
#   loginctl lock-session   needs org.freedesktop.login1. FreeBSD has no logind,
#                           so before_sleep_cmd/after_sleep_cmd could never fire
#                           and are dropped. Idle timeouts below are unaffected --
#                           they come from ext-idle-notify-v1, which niri
#                           implements natively.
#   brightnessctl           Linux backlight tool, not available on FreeBSD.
#                           backlight(8) is in base and works unprivileged here,
#                           but has no save/restore, so the level is stashed.
#
# pidof is also Linux-only; pgrep is the portable equivalent.

general {
  lock_cmd = pgrep -x hyprlock > /dev/null || hyprlock
  ignore_dbus_inhibit = false
}

# 5 min: dim the backlight, restoring the previous level on resume.
listener {
  timeout = 300
  on-timeout = sh -c 'backlight | awk "{print \$2}" > "/tmp/backlight.save.$(id -u)"; backlight 10'
  on-resume = sh -c 'backlight "$(cat "/tmp/backlight.save.$(id -u)" 2>/dev/null || echo 100)"'
}

# 10 min: arm the shutdown timer, then lock. This is the FreeBSD equivalent of
# the NixOS hypridle-lock-and-arm / hypridle-disarm pair -- see ~/bin/shutdown-timer.
# Arm first, because hyprlock blocks until the session is unlocked.
listener {
  timeout = 600
  on-timeout = sh -c 'shutdown-timer arm; pgrep -x hyprlock > /dev/null || hyprlock'
  on-resume = shutdown-timer disarm
}

# 20 min: monitors off.
listener {
  timeout = 1200
  on-timeout = niri msg action power-off-monitors
  on-resume = niri msg action power-on-monitors
}
