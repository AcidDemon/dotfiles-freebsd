# Wallpaper pools and rotation, read by ~/bin/wallpaper. Plain sh, sourced;
# the environment wins over every value here.

# Where to pick images from. {theme} becomes the active theme id, so each
# theme has its own pool; an empty or missing pool keeps the current wallpaper.
[ -n "${WALLPAPER_DIR-}" ] || WALLPAPER_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/wallpapers/themes/{theme}"

# Seconds between changes while shuffle is on, until `wallpaper interval N`
# stores one in ~/.local/state/wallpaper/interval.
INTERVAL="${INTERVAL:-900}"

# Transition for rotation and theme switches (`wallpaper apply`). awww reads
# these itself; `wallpaper pick` and `shuffle on` use grow 0.6 s instead.
#   none simple fade left right top bottom wipe wave grow center any outer random
AWWW_TRANSITION="${AWWW_TRANSITION:-random}"
AWWW_TRANSITION_DURATION="${AWWW_TRANSITION_DURATION:-2}"
AWWW_TRANSITION_FPS="${AWWW_TRANSITION_FPS:-60}"

# Extra knobs awww honours, uncomment as needed:
#   AWWW_TRANSITION_STEP    how fast it approaches the new image (255 = instant)
#   AWWW_TRANSITION_ANGLE   for 'wipe' and 'wave'
#   AWWW_TRANSITION_POS     for 'grow' and 'outer', e.g. center / 0.5,0.5
#   AWWW_TRANSITION_BEZIER  for 'fade'
#   AWWW_TRANSITION_WAVE    width,height for 'wave'
