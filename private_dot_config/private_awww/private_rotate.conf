# Wallpaper rotation, read by ~/bin/awww-random. Plain sh, sourced.

# Where to pick images from, and how often to change (seconds).
WALLPAPER_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/wallpapers"
INTERVAL=900

# Transition effect. awww reads these itself; the script only exports them.
#   none simple fade left right top bottom wipe wave grow center any outer random
AWWW_TRANSITION=random
AWWW_TRANSITION_DURATION=2
AWWW_TRANSITION_FPS=60

# Extra knobs awww honours, uncomment as needed:
#   AWWW_TRANSITION_STEP    how fast it approaches the new image (255 = instant)
#   AWWW_TRANSITION_ANGLE   for 'wipe' and 'wave'
#   AWWW_TRANSITION_POS     for 'grow' and 'outer', e.g. center / 0.5,0.5
#   AWWW_TRANSITION_BEZIER  for 'fade'
#   AWWW_TRANSITION_WAVE    width,height for 'wave'
