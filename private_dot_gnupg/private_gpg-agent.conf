# Use gpg-agent as the SSH agent, backed by the YubiKey's OpenPGP authentication subkey
enable-ssh-support

# (GPG_TTY exported in ~/.zshrc.)
pinentry-program /usr/local/bin/pinentry-qt

# Cache lifetimes in seconds
default-cache-ttl 34560
max-cache-ttl 86400
default-cache-ttl-ssh 34560
max-cache-ttl-ssh 86400
