# Reach the YubiKey via pcscd (PC/SC) instead of scdaemon's internal CCID
# driver.
disable-ccid
pcsc-driver /usr/local/lib/libpcsclite.so.1

# Let ykmand use the reader as well
pcsc-shared
card-timeout 5

# Keep a log so the next card-status attempt is diagnosable if needed.
log-file /home/acid/.gnupg/scd.log
